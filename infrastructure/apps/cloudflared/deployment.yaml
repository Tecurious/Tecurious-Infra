# cloudflared — Cloudflare Tunnel connector for saiserver.
# Public entry for devstrom apps: api.devstrom.site -> dev-strom-api.
#
# One-time out-of-band secret (values NEVER committed):
#   kubectl create namespace cloudflared
#   kubectl -n cloudflared create secret generic cloudflared-token \
#     --from-literal=token=<TUNNEL_TOKEN from Cloudflare Zero Trust dashboard>
#
# The tunnel is REMOTELY managed: ingress rules (hostname -> service) live in
# the Cloudflare dashboard, not here. This Deployment only runs the connector.
# New public app = add a route in the dashboard + CNAME, no manifest changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cloudflared
  name: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.1
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - localhost:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
            - name: GOMAXPROCS
              value: "2"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # No liveness probe: cloudflared's /ready was too strict for the
          # ~100s probe-kill window (SIGTERM loop on a healthy tunnel).
          # Cloudflared self-manages reconnects; restartPolicy covers crashes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
