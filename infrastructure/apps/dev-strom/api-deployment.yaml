apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: devstrom
  name: dev-strom-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-strom-api
  template:
    metadata:
      labels:
        app: dev-strom-api
    spec:
      containers:
        - name: api
          image: ghcr.io/tecurious/dev-strom-api:v0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: dev-strom-secrets
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  namespace: devstrom
  name: dev-strom-api
spec:
  selector:
    app: dev-strom-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
