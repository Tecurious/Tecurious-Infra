apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: devstrom
  name: dev-strom-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-strom-api
  template:
    metadata:
      labels:
        app: dev-strom-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/tecurious/dev-strom-api:v0.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Public origin of the SPA (Cloudflare Pages). Drives CORS
            # allow_origins and session-cookie Secure flag.
            - name: WEB_BASE_URL
              value: "https://devstrom.site"
            # OAuth redirect_uri is derived from this (auth/providers.py) —
            # must be the PUBLIC API origin, or GitHub auth loops on localhost.
            - name: API_BASE_URL
              value: "https://api.devstrom.site"
          envFrom:
            - secretRef:
                name: dev-strom-secrets
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  namespace: devstrom
  name: dev-strom-api
spec:
  selector:
    app: dev-strom-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
