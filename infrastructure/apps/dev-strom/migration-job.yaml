apiVersion: batch/v1
kind: Job
metadata:
  namespace: devstrom
  name: dev-strom-migrate
  annotations:
    # ArgoCD hook: run before the app syncs, delete+rerun on each new revision
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/tecurious/dev-strom-api:v0.1.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: dev-strom-secrets
