apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: devstrom
  name: dev-strom-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-strom-web
  template:
    metadata:
      labels:
        app: dev-strom-web
    spec:
      containers:
        - name: web
          image: ghcr.io/tecurious/dev-strom-web:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  namespace: devstrom
  name: dev-strom-web
spec:
  type: NodePort
  selector:
    app: dev-strom-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30310
