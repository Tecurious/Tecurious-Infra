# Immich machine learning (faces, smart search). CPU only for now.
# The Service name matches Immich's default ML URL (http://immich-machine-learning:3003),
# so the server needs no extra setting. Models download into the cache volume on first use.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: immich
  name: immich-ml-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  namespace: immich
  name: immich-machine-learning
  labels:
    app: immich-machine-learning
spec:
  selector:
    app: immich-machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: immich
  name: immich-machine-learning
  labels:
    app: immich-machine-learning
spec:
  replicas: 1
  strategy:
    type: Recreate   # the cache volume is ReadWriteOnce
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.0@sha256:f4e7275c9fbd956ed7bccc738ac57890bcbd9f9c17844d2ea0b137e38a083454
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: TZ
              value: America/New_York
          volumeMounts:
            - name: cache
              mountPath: /cache
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "4"
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
