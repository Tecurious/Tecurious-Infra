apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data

resources:
  - statefulset.yaml

# NOTE: postgres-credentials Secret is created out-of-band (it must never live in
# git). Recreate manually with:
#   kubectl -n data create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=POSTGRES_DB=...
