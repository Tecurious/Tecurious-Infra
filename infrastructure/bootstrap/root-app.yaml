apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: devpool
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Tecurious/Tecurious-Infra.git
    targetRevision: main
    path: infrastructure/apps/apps-onboard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
