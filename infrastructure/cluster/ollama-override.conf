# /etc/systemd/system/ollama.service.d/override.conf (installed by firewall-block-nodeports.sh)
# Ollama listens on every interface so tailnet devices can use it at http://sai:11434.
# tailscale-only.service drops port 11434 on everything except tailscale0.
# Ollama won't start unless that firewall service is active.
#
# Why not `tailscale serve`: while bound to 127.0.0.1, Ollama rejects any request whose
# Host header isn't localhost (403), and tailscale serve keeps the *.ts.net Host header.
[Unit]
Requires=tailscale-only.service
After=tailscale-only.service

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
